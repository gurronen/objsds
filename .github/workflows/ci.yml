name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-deny
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-targets
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo deny check
      - run: cargo package --workspace --exclude objsds-tests --exclude objsds-napi --locked

  typescript:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/objsds-napi/npm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/objsds-napi/npm/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run test:release
      - run: npm run test:package
      - run: npm pack --dry-run

  typescript-s3:
    runs-on: ubuntu-latest
    services:
      rustfs:
        image: rustfs/rustfs:latest
        env:
          RUSTFS_ACCESS_KEY: rustfsadmin
          RUSTFS_SECRET_KEY: rustfsadmin
        ports:
          - 9000:9000
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/objsds-napi/npm/package-lock.json
      - run: npm ci
        working-directory: crates/objsds-napi/npm
      - name: Create the RustFS test bucket
        run: cargo test -p objsds-tests --features rustfs-e2e --test rustfs -- --nocapture
        env:
          OBJSDS_RUSTFS_E2E: "1"
      - run: npm run test:s3
        working-directory: crates/objsds-napi/npm
        env:
          OBJSDS_RUSTFS_E2E: "1"

  native-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-14
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/objsds-napi/npm/package-lock.json
      - run: npm ci
        working-directory: crates/objsds-napi/npm
      - run: npm run build:native -- --target ${{ matrix.target }}
        working-directory: crates/objsds-napi/npm

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets
