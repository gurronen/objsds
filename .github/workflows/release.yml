name: Release
run-name: ${{ inputs.publish && format('release {0}', inputs.version || 'next patch') || format('rehearse {0}', inputs.version || 'next patch') }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact SemVer override; defaults to one patch after the registries' current version
        required: false
        type: string
      publish:
        description: Publish crates.io, npm, GitHub assets, and the final version tag
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}-${{ inputs.version || 'next-patch' }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Require current main for publication
        if: inputs.publish
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "published releases must run from main, not ${GITHUB_REF}" >&2
            exit 1
          fi
          git fetch --no-tags origin main
          if [[ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]]; then
            echo "the selected commit is not the current origin/main" >&2
            exit 1
          fi

      - uses: jdx/mise-action@v4
        with:
          install_args: rust
      - uses: Swatinem/rust-cache@v2

      - name: Resolve release version
        id: version
        env:
          VERSION_OVERRIDE: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ -n "$VERSION_OVERRIDE" ]]; then
            version="$(mise run release:resolve --version "$VERSION_OVERRIDE")"
          else
            version="$(mise run release:resolve)"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Resolved release version ${version}"

      - name: Stage and validate complete workspace
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: mise run release:validate

  native-build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            flags: --use-napi-cross
            zig: false
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            flags: ""
            zig: false
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            flags: --cross-compile
            zig: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            flags: --cross-compile
            zig: true
          - os: macos-14
            target: aarch64-apple-darwin
            flags: ""
            zig: false
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            flags: ""
            zig: false
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            flags: ""
            zig: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          install_args: ${{ matrix.zig && 'node rust zig@0.15.2' || 'node rust' }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - name: Build native artifact
        run: mise run ${{ matrix.zig && 'build:native:zig' || 'build:native' }}
        env:
          BUILD_TARGET: ${{ matrix.target }}
          BUILD_FLAGS: ${{ matrix.flags }}
      - uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.target }}
          path: crates/objsds-napi/npm/objsds-napi.*.node
          if-no-files-found: error

  package-npm:
    needs: [version, native-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          install_args: node
      - uses: actions/download-artifact@v8
        with:
          pattern: native-*
          path: crates/objsds-napi/npm
          merge-multiple: true
      - name: Stage and pack npm package
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: mise run release:package-npm
      - uses: actions/upload-artifact@v7
        with:
          name: npm-package
          path: crates/objsds-napi/npm/release/*.tgz
          if-no-files-found: error

  publish-crates:
    if: inputs.publish
    needs: [version, native-build, package-npm]
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          install_args: rust
      - name: Publish crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: mise run release:publish-crates

  publish-npm:
    if: inputs.publish
    needs: [version, native-build, package-npm]
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          install_args: node
      - uses: actions/download-artifact@v8
        with:
          name: npm-package
          path: release
      - name: Configure npm registry authentication
        run: |
          echo 'registry=https://registry.npmjs.org' >> "$HOME/.npmrc"
          echo '//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}' >> "$HOME/.npmrc"
      - name: Publish @objsds/client
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: mise run release:publish-npm

  github-release:
    if: inputs.publish
    needs: [version, native-build, package-npm, publish-crates, publish-npm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: native-*
          path: release-assets
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: npm-package
          path: release-assets
      - name: Create final tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" release-assets/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" release-assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$tag" \
              --generate-notes
          fi
