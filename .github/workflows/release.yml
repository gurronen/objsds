name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version already committed in Cargo.toml and package.json (without v)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require current main branch
        env:
          EXPECTED_REF: refs/heads/main
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "$EXPECTED_REF" ]]; then
            echo "release workflows must run from ${EXPECTED_REF}, not ${GITHUB_REF}" >&2
            exit 1
          fi

          git fetch --no-tags origin main
          if [[ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]]; then
            echo "the selected commit is not the current origin/main" >&2
            exit 1
          fi
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "release checkout is dirty" >&2
            git status --short >&2
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/objsds-napi/npm/package-lock.json

      - name: Validate versions and release state
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          python3 scripts/release.py validate --version "$VERSION"
          npm_version="$(node -p "require('./crates/objsds-napi/npm/package.json').version")"
          if [[ "$npm_version" != "$VERSION" ]]; then
            echo "@objsds/client version ${npm_version} does not match release ${VERSION}" >&2
            exit 1
          fi

      - name: Validate workspace
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py'
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo test --workspace --all-targets
          cargo package --workspace --exclude objsds-tests --exclude objsds-napi --locked

  native-build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            flags: --use-napi-cross
            zig: false
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            flags: --use-napi-cross
            zig: false
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            flags: --cross-compile
            zig: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            flags: --cross-compile
            zig: true
          - os: macos-14
            target: aarch64-apple-darwin
            flags: ""
            zig: false
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            flags: ""
            zig: false
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            flags: ""
            zig: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/objsds-napi/npm/package-lock.json
      - name: Install Zig
        if: matrix.zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
      - run: npm ci
        working-directory: crates/objsds-napi/npm
      - name: Build native artifact
        working-directory: crates/objsds-napi/npm
        env:
          TARGET_CC: clang
          TARGET_CXX: clang++
        run: npm run build:native -- --target ${{ matrix.target }} ${{ matrix.flags }}
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.target }}
          path: crates/objsds-napi/npm/objsds-napi.*.node
          if-no-files-found: error

  publish-crates:
    needs: [validate, native-build]
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: python3 scripts/release.py publish --version "$VERSION"

  publish-npm:
    needs: [validate, native-build]
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: crates/objsds-napi/npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: crates/objsds-napi/npm/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: crates/objsds-napi/npm
          merge-multiple: true
      - run: npm ci
      - run: npm run check
      - run: npm run build:typescript
      - run: npm run test:release
      - name: Validate assembled npm package
        env:
          VERSION: ${{ inputs.version }}
        run: npm run release:validate -- "$VERSION"
      - run: npm pack --dry-run
      - name: Publish @objsds/client
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if npm view "@objsds/client@${VERSION}" version >/dev/null 2>&1; then
            echo "@objsds/client ${VERSION} is already published; skipping"
          else
            npm publish --access public --provenance
          fi

  tag:
    needs: [publish-crates, publish-npm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag release
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          git tag --annotate "$tag" --message "Release ${VERSION}"
          git push origin "$tag"
