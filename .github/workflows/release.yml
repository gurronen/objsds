name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version already committed in Cargo.toml (without v)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: crates-io-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require current main branch
        env:
          EXPECTED_REF: refs/heads/main
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "$EXPECTED_REF" ]]; then
            echo "release workflows must run from ${EXPECTED_REF}, not ${GITHUB_REF}" >&2
            exit 1
          fi

          git fetch --no-tags origin main
          if [[ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]]; then
            echo "the selected commit is not the current origin/main" >&2
            exit 1
          fi
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "release checkout is dirty" >&2
            git status --short >&2
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Validate release is new
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess

          version = os.environ["VERSION"]
          if not re.fullmatch(r"(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?", version):
              raise SystemExit(f"invalid SemVer version: {version!r}")

          metadata = json.loads(subprocess.check_output(
              ["cargo", "metadata", "--no-deps", "--format-version", "1"],
              text=True,
          ))
          publishable = [package for package in metadata["packages"] if package["publish"] != []]
          mismatches = [
              f'{package["name"]}={package["version"]}'
              for package in publishable
              if package["version"] != version
          ]
          if mismatches:
              raise SystemExit(
                  "workflow version does not match committed package versions: "
                  + ", ".join(mismatches)
              )
          PY

          tag="v${VERSION}"
          if git rev-parse --verify --quiet "refs/tags/${tag}" >/dev/null; then
            echo "tag ${tag} already exists" >&2
            exit 1
          fi

          for crate in objsds-store objsds-store-memory objsds-store-s3 objsds; do
            status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
              --user-agent 'objsds-release-workflow (https://github.com/gurronen/objsds)' \
              "https://crates.io/api/v1/crates/${crate}/${VERSION}")"
            case "$status" in
              404) ;;
              200)
                echo "${crate} ${VERSION} is already published; it will be skipped"
                ;;
              *)
                echo "crates.io returned HTTP ${status} for ${crate} ${VERSION}" >&2
                exit 1
                ;;
            esac
          done

      - name: Validate workspace
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo test --workspace --all-targets
          cargo package --workspace --exclude objsds-tests --locked

      - name: Publish crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail

          registry_status() {
            curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
              --user-agent 'objsds-release-workflow (https://github.com/gurronen/objsds)' \
              "https://crates.io/api/v1/crates/$1/${{ inputs.version }}"
          }

          publish() {
            local package="$1"
            local status
            for attempt in $(seq 1 12); do
              status="$(registry_status "$package")"
              case "$status" in
                200)
                  echo "Skipping ${package} ${{ inputs.version }}: already published"
                  return 0
                  ;;
                404) ;;
                *)
                  echo "crates.io returned HTTP ${status} for ${package} ${{ inputs.version }}" >&2
                  return 1
                  ;;
              esac

              if cargo publish --locked -p "$package"; then
                return 0
              fi
              if [ "$attempt" -eq 12 ]; then
                return 1
              fi
              echo "publish of ${package} is not ready; retrying in 10 seconds"
              sleep 10
            done
          }

          publish objsds-store
          publish objsds-store-memory
          publish objsds-store-s3
          publish objsds

      - name: Tag release
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          git tag --annotate "$tag" --message "Release ${VERSION}"
          git push origin "$tag"
