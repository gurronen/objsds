# cargo-deny configuration for objsds.
# Keep this policy intentionally small; tighten it as dependencies are added.

[advisories]
version = 2
# Tracking advisory: https://rustsec.org/advisories/RUSTSEC-2026-0194.html
# s3 0.1.36 limits object-operation error bodies to 256 KiB. Remove this
# exception when s3 upgrades to quick-xml 0.41 or later.
# Tracking advisory: https://rustsec.org/advisories/RUSTSEC-2026-0195.html
# s3 0.1.36 does not use quick_xml::NsReader. Remove this exception when s3
# upgrades to quick-xml 0.41 or later.
ignore = ["RUSTSEC-2026-0194", "RUSTSEC-2026-0195"]

[bans]
# Runtime and provider dependencies stay in adapter crates. Review additions
# through Cargo.lock and cargo-deny rather than maintaining a wildcard ban.
allow-workspace = true

# Duplicate versions are often harmless during early development, but make
# them visible so they can be consolidated deliberately.
multiple-versions = "warn"

# Avoid unreviewed wildcard dependency requirements.
wildcards = "deny"

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
