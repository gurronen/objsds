[workspace]
members = [
    "crates/objsds",
    "crates/objsds-store",
    "crates/objsds-store-memory",
    "crates/objsds-store-s3",
    "crates/objsds-tests",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.96"

[workspace.lints.clippy]
unwrap_used = "warn"

[workspace.dependencies]
objsds = { version = "0.1.0", path = "crates/objsds" }
objsds-store = { version = "0.1.0", path = "crates/objsds-store" }
objsds-store-memory = { version = "0.1.0", path = "crates/objsds-store-memory" }
objsds-store-s3 = { version = "0.1.0", path = "crates/objsds-store-s3" }
s3-client = { package = "s3", version = "0.1.36", default-features = false, features = ["blocking", "rustls"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
uuid = { version = "1.16.0", features = ["serde", "v7"] }
